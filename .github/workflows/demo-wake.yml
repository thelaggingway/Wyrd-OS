# Wyrd-OS (MODIFICATIONS.md): resumes the demo server shortly before its routines are due. The demo runs on an
# InstaBox machine that pauses when idle, and a paused machine fires no routine. Through the InstaBox API (not the
# app's URL) the job resumes the machine, which works however it was paused, then takes a one-hour activity lease
# so the machine isn't paused under a long run; the lease ends by itself and the machine pauses once idle again.
# Secrets: INSTABOX_API_KEY (scope machines:write) and INSTABOX_MACHINE_ID. Without them the job does nothing.
name: demo-wake

on:
  schedule:
    # In UTC; each is 10 minutes before an IST routine.
    - cron: "50 17 * * *" # 23:30 IST, the Librarian's nightly
    - cron: "20 16 * * 0" # Sunday 22:00 IST, the weekly wiki tidy
    - cron: "20 11 * * *" # 17:00 IST
    - cron: "20 12 * * *" # 18:00 IST
    - cron: "20 2 * * 1" # Monday 08:00 IST
  workflow_dispatch:

permissions: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resume and hold awake for an hour
        env:
          KEY: ${{ secrets.INSTABOX_API_KEY }}
          ID: ${{ secrets.INSTABOX_MACHINE_ID }}
        run: |
          if [ -z "$KEY" ] || [ -z "$ID" ]; then echo "INSTABOX_API_KEY or INSTABOX_MACHINE_ID is not set"; exit 0; fi
          api="https://api.instabox.sh/v1/machines/$ID"
          # Resume returns an operation; an already running machine answers with one already succeeded.
          op=$(curl -fsS --max-time 30 -X POST -H "X-API-Key: $KEY" -H "Idempotency-Key: wake-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$api/resume" | jq -r '.id // .operationId // .operation.id')
          echo "resume operation $op"
          # Wait for it, at most 5 minutes in all (each long poll is bounded at 25 s).
          deadline=$(( $(date +%s) + 300 ))
          state=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            state=$(curl -sS --max-time 30 -H "X-API-Key: $KEY" "https://api.instabox.sh/v1/operations/$op?wait=25s" | jq -r '.state')
            [ "$state" = succeeded ] && break
            [ "$state" = failed ] && break
            sleep 5
          done
          [ "$state" = succeeded ] || { echo "::error::resume ended $state"; exit 1; }
          # Pausing for idleness waits while a lease is held; it expires on its own after ttlSeconds.
          curl -fsS --max-time 30 -X PUT -H "X-API-Key: $KEY" -H "Content-Type: application/json" \
            -d '{"ttlSeconds": 3600}' "$api/activity-leases/routines" >/dev/null
          echo "awake, held for an hour"
